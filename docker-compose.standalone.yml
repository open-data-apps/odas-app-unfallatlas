services:
  app:
    ports: !reset []
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxynet"
      # FQDN ohne Protokoll oder Pfad ersetzen.
      - "traefik.http.routers.app.rule=Host(`appname.example.com`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls.certresolver=letsencrypt"
      - "traefik.http.routers.app.service=app"
      # Interner Nginx-Port; nicht aendern.
      - "traefik.http.services.app.loadbalancer.server.port=80"
    networks:
      - proxynet

networks:
  # Muss als externes Traefik-Netzwerk existieren.
  proxynet:
    external: true
